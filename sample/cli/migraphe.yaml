repositories:
  - id: jitpack
    url: https://jitpack.io

plugins:
  - coordinate: com.github.kakusuke.migraphe:migraphe-plugin-postgresql:v0.4.2
    repository: jitpack
  - coordinate: com.github.kakusuke.migraphe:migraphe-plugin-mysql:v0.4.2
    repository: jitpack
  - coordinate: com.github.kakusuke.migraphe:migraphe-plugin-generator-json:v0.4.2
    repository: jitpack

project:
  name: ecommerce-cli-sample

history:
  target: pg

generators:
  - name: pg-schema-docs
    type: postgresql-markdown
    source:
      type: postgresql-schema
      target: pg
    output-dir: docs/postgresql

  - name: mysql-schema-docs
    type: mysql-markdown
    source:
      type: mysql-schema
      target: mysql
    output-dir: docs/mysql

  - name: migration-tree
    type: output-json
    source:
      type: migration-tree
    output-dir: docs
