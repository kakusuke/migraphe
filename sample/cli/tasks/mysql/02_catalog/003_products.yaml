name: Create products table
target: mysql
dependencies:
  - mysql/02_catalog/001_categories
  - mysql/02_catalog/002_brands
up: |
  CREATE TABLE products (
    id BIGINT AUTO_INCREMENT PRIMARY KEY COMMENT 'Product surrogate key',
    sku VARCHAR(64) NOT NULL UNIQUE COMMENT 'Unique product-level SKU (variants carry their own SKU)',
    name VARCHAR(255) NOT NULL COMMENT 'Product display name',
    description TEXT NULL COMMENT 'Long-form product description',
    category_id BIGINT NOT NULL COMMENT 'Category the product belongs to',
    brand_id BIGINT NULL COMMENT 'Optional brand association',
    status VARCHAR(16) NOT NULL DEFAULT 'draft' COMMENT 'Lifecycle state (draft/published/archived)',
    created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP COMMENT 'Record creation timestamp',
    updated_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP COMMENT 'Record last-update timestamp',
    CONSTRAINT fk_products_category FOREIGN KEY (category_id) REFERENCES categories (id),
    CONSTRAINT fk_products_brand FOREIGN KEY (brand_id) REFERENCES brands (id)
  ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COMMENT='Product catalog entries shown on the storefront';
down: |
  DROP TABLE IF EXISTS products;
