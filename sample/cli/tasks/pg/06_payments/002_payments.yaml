name: Create payments table
target: pg
dependencies:
  - pg/05_orders/001_orders
  - pg/06_payments/001_payment_methods
up: |
  CREATE TABLE payments (
    id BIGSERIAL PRIMARY KEY,
    order_id BIGINT NOT NULL REFERENCES orders (id),
    payment_method_id BIGINT NULL REFERENCES payment_methods (id),
    amount NUMERIC(12,2) NOT NULL,
    currency_code VARCHAR(3) NOT NULL,
    status VARCHAR(32) NOT NULL DEFAULT 'pending',
    external_id VARCHAR(128) NULL,
    processed_at TIMESTAMPTZ NULL,
    created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
    updated_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
  );
  COMMENT ON TABLE payments IS 'Payment transactions captured per order';
  COMMENT ON COLUMN payments.id IS 'Payment surrogate key';
  COMMENT ON COLUMN payments.order_id IS 'Order being paid for';
  COMMENT ON COLUMN payments.payment_method_id IS 'Payment method used (nullable for guest/cash)';
  COMMENT ON COLUMN payments.amount IS 'Charged amount';
  COMMENT ON COLUMN payments.currency_code IS 'Logical reference to MySQL currencies.code (no FK)';
  COMMENT ON COLUMN payments.status IS 'Transaction state (pending/succeeded/failed/refunded)';
  COMMENT ON COLUMN payments.external_id IS 'PSP-side transaction identifier';
  COMMENT ON COLUMN payments.processed_at IS 'When the PSP processed the charge';
  COMMENT ON COLUMN payments.created_at IS 'Record creation timestamp';
  COMMENT ON COLUMN payments.updated_at IS 'Record last-update timestamp';
down: |
  DROP TABLE IF EXISTS payments;
